name: Deploy HTML pages

on:
  push:
    paths:
      - "netlify-deploy-pack.zip"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          rm -rf public /tmp/deploy-pack
          mkdir -p public /tmp/deploy-pack
          unzip -q netlify-deploy-pack.zip -d /tmp/deploy-pack
          cp -R /tmp/deploy-pack/netlify/. public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
